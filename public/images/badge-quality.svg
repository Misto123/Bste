<!-- Beste Prijs/Kwaliteit Badge -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 32" fill="none">
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="160" height="32" rx="16" fill="url(#greenGradient)"/>
  
  <!-- Icon -->
  <text x="10" y="22" font-size="16">💚</text>
  
  <!-- Text -->
  <text x="32" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
    Prijs/Kwaliteit
  </text>
</svg>
